<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DROCON - MR Drone Simulator</title>

  <!-- PWA Meta Tags -->
  <meta name="description" content="Mixed Reality Drone Simulator for Quest 3 / Quest Pro">
  <meta name="theme-color" content="#00c8ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DROCON">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
      /* PWA Safe Area対応 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    #app {
      width: 100%;
      height: 100%;
    }

    /* Landing Page */
    #landing-page {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      padding-top: calc(20px + env(safe-area-inset-top));
      padding-bottom: calc(20px + env(safe-area-inset-bottom));
      overflow-y: auto;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 50%, #0d0d2a 100%);
    }

    /* Animated Background */
    #landing-page::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(0, 200, 255, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(255, 107, 107, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(0, 255, 150, 0.05) 0%, transparent 60%);
      pointer-events: none;
      animation: pulseBackground 8s ease-in-out infinite;
    }

    @keyframes pulseBackground {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Grid Lines */
    .grid-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image:
        linear-gradient(rgba(0, 200, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 200, 255, 0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
    }

    /* Start Container */
    .start-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
    }

    /* Action Buttons */
    .action-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(10px, 2vmin, 20px);
      margin-top: clamp(15px, 3vmin, 30px);
      position: relative;
      z-index: 1;
      flex-shrink: 0;
    }

    .action-btn {
      padding: clamp(12px, 2vmin, 18px) clamp(30px, 5vmin, 50px);
      font-family: 'Orbitron', sans-serif;
      font-size: clamp(0.9rem, 2vmin, 1.2rem);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .action-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .action-btn:hover::before {
      left: 100%;
    }

    .mr-btn {
      background: linear-gradient(135deg, #00c8ff 0%, #0080ff 100%);
      color: #fff;
      box-shadow:
        0 0 20px rgba(0, 200, 255, 0.4),
        0 5px 15px rgba(0, 0, 0, 0.3);
    }

    .mr-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 0 30px rgba(0, 200, 255, 0.6),
        0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .action-btn:active {
      transform: translateY(0);
    }

    /* MR Start Only Button (大きなボタン) */
    .mr-start-only {
      padding: clamp(25px, 5vmin, 40px) clamp(60px, 12vmin, 120px);
      font-size: clamp(1.5rem, 4vmin, 2.5rem);
      border-radius: 20px;
      letter-spacing: 0.2em;
      animation: pulseButton 2s ease-in-out infinite;
    }

    @keyframes pulseButton {
      0%, 100% {
        box-shadow:
          0 0 20px rgba(0, 200, 255, 0.4),
          0 5px 15px rgba(0, 0, 0, 0.3);
      }
      50% {
        box-shadow:
          0 0 40px rgba(0, 200, 255, 0.7),
          0 10px 30px rgba(0, 0, 0, 0.4);
      }
    }

    /* Hidden state for original elements */
    #start-button {
      display: none !important;
    }

    #info {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
      z-index: 100;
    }

    #depth-toggle {
      position: absolute;
      bottom: 20px;
      right: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background: #2196F3;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
      transition: all 0.3s;
      z-index: 100;
      display: none;
    }

    #depth-toggle:hover {
      background: #1976D2;
      transform: scale(1.05);
    }

    /* Scrollbar styling */
    #landing-page::-webkit-scrollbar {
      width: 8px;
    }

    #landing-page::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.3);
    }

    #landing-page::-webkit-scrollbar-thumb {
      background: rgba(0, 200, 255, 0.5);
      border-radius: 4px;
    }

    #landing-page::-webkit-scrollbar-thumb:hover {
      background: rgba(0, 200, 255, 0.7);
    }

  </style>
</head>
<body>
  <div id="app"></div>

  <!-- Landing Page (シンプルなMRスタートボタンのみ) -->
  <div id="landing-page">
    <div class="grid-overlay"></div>

    <!-- 中央のMRスタートボタンのみ -->
    <div class="start-container">
      <button class="action-btn mr-btn mr-start-only" id="landing-mr-btn">MR START</button>
    </div>
  </div>

  <button id="start-button">MR START</button>
  <button id="depth-toggle">深度表示 OFF</button>
  <div id="info">ドローンを表示するには「MR START」をタップしてください</div>

  <script type="module">
    // Landing page button handlers - すぐにMRに入る
    document.getElementById('landing-mr-btn').addEventListener('click', function() {
      this.disabled = true;
      document.getElementById('landing-page').style.display = 'none';
      document.getElementById('start-button').click();
    });
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
